<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Locker</title>
    <link rel="icon" type="image/x-icon" href="kepek/ikon1.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light bg-light shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">← Vissza</a>
        <span class="fw-bold">Fashion Locker</span>
    </div>
</nav>

<!-- TERMÉK -->
<div class="container py-5">
    <div class="row g-5 align-items-center">

        <!-- KÉP -->
        <div class="col-12 col-lg-6 text-center">
            <img src="kepek/jordan1_2.PNG" class="img-fluid termek-kep">
        </div>

        <!-- JOBB OLDAL -->
        <div class="col-12 col-lg-6">

            <h2 class="mb-3">Nike Jordan 1 Bear</h2>
            <h4 class="text-danger mb-4">49 999 Ft</h4>

            <p>Kiválasztott méret: <span id="kivalasztott">-</span></p>

            <!-- MÉRETEK -->
            <div class="meretek mb-4">
                <!-- generálható is JS-sel később -->
                <input type="radio" name="meret" id="m36"><label for="m36">36</label>
                <input type="radio" name="meret" id="m37"><label for="m37">37</label>
                <input type="radio" name="meret" id="m38"><label for="m38">38</label>
                <input type="radio" name="meret" id="m39"><label for="m39">39</label>
                <input type="radio" name="meret" id="m40"><label for="m40">40</label>
                <input type="radio" name="meret" id="m41"><label for="m41">41</label>
                <input type="radio" name="meret" id="m42"><label for="m42">42</label>
                <input type="radio" name="meret" id="m43"><label for="m43">43</label>
                <input type="radio" name="meret" id="m44"><label for="m44">44</label>
                <input type="radio" name="meret" id="m45"><label for="m45">45</label>
            </div>

            <!-- KOSÁR GOMB -->
            <button class="btn btn-dark w-100" id="kosarBtn">
                Kosárba tesz
            </button>

        </div>

    </div>
</div>

<script>
    const meretek = document.querySelectorAll('input[name="meret"]');
    const ki = document.getElementById("kivalasztott");

    meretek.forEach(m => {
        m.addEventListener("change", () => {
            ki.textContent = m.id.replace("m", "");
        });
    });

    document.getElementById("kosarBtn").addEventListener("click", () => {
        if (ki.textContent === "-") {
            alert("Válassz méretet!");
        } else {
            alert("Kosárba téve: méret " + ki.textContent);
        }
    });
</script>

</body>
</html>
